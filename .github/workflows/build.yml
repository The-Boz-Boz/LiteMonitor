name: build
on:
  push:
    branches: [ci-build, ci-follow-tray]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: New-Item -ItemType File -Force '使用说明(必读).txt' | Out-Null
      - run: dotnet publish LiteMonitor.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o out
      - uses: actions/upload-artifact@v4
        with:
          name: LiteMonitor-win-x64
          path: out/
